buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
// Generates the TurboModule spec base class from src/NativeLightSession.ts. The module below extends
// what this produces, so the JavaScript signature and the Kotlin one cannot drift apart — a mismatch
// becomes a compile error instead of a silent no-op at runtime.
apply plugin: "com.facebook.react"

android {
    namespace "com.lightsession.reactnative"
    compileSdk 36

    defaultConfig {
        // 26, matching the LightSession Android SDK. A library's minSdk is a ceiling on who can consume
        // it, so this cannot be lower than what it depends on — and React Native's own template
        // defaults to 24, which means an app adopting this has to raise its floor. Worth knowing before
        // adopting rather than after.
        minSdk 26
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    // The SDK this wraps now resolves from Maven Central like any other dependency, so there is
    // nothing special here any more.
    //
    // A `mavenLocal` entry lived here while it was unpublished, and it is deliberately gone: a
    // stale artefact from somebody's `publishToMavenLocal` would shadow the released one silently,
    // and the symptom is a build that works on one machine and not another with no message
    // pointing at the cause.
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    // The SDK as it stands, and it has to be kept there by hand: nothing here moves it, and this pin
    // sat at 0.28.0 while the SDK reached 0.39.1. What that cost a React Native app was measured, not
    // assumed — a WebView's page, covered whole since 0.37.0, shipped legible in the screen map; a
    // session did not end with the app going to the background (0.30.0); a SurfaceView, a map's or a
    // video's, came back black in the replay (0.32.0). And from 0.39.2 a JavaScript crash is counted
    // once, rather than a second time as the `JavascriptException` React Native ends the app with.
    implementation "io.lightsession:lightsession-android:0.39.2"
}
